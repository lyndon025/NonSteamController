name: Release

# Publishes a portable build when a v* tag is pushed.
#
# Why a zip and not the Inno installer: installer/Build-Installer.ps1 signs the
# Game Bar widget MSIX, and a sideloadable MSIX *must* be signed. The script
# throws when the certificate is not in the cert store, so CI cannot produce the
# full installer without a signing certificate supplied as a repository secret.
# See docs at the bottom of this file for enabling that.
#
# The zip therefore ships the app only. It expects the usbip-win2 driver to be
# present already, which means it is an update mechanism, not a first install.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Release
        shell: pwsh
        run: cmake --preset release

      - name: Build Release
        shell: pwsh
        run: cmake --build --preset release

      - name: Stage portable package
        shell: pwsh
        run: |
          $out = Join-Path $PWD "build\release\Release"
          $exe = Join-Path $out "Steam Controller Remapper.exe"
          if (-not (Test-Path $exe)) { throw "Build output not found at $exe" }

          $stage = Join-Path $PWD "stage\NonSteamController"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          Copy-Item $exe $stage
          # Copied next to the exe by the CMake POST_BUILD step; the app
          # LoadLibrary's it from its own directory at runtime.
          Copy-Item (Join-Path $out "libVIIPER.dll") $stage
          Copy-Item "README.md","LICENSE" $stage
          Copy-Item "LICENSES" $stage -Recurse

          $zip = Join-Path $PWD "NonSteamController-$($env:GITHUB_REF_NAME)-portable.zip"
          Compress-Archive -Path "$stage\*" -DestinationPath $zip -Force
          "ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build standalone installer
        shell: pwsh
        run: |
          $out    = Join-Path $PWD "build\release\Release"
          $stage  = Join-Path $PWD "installer\staging"
          New-Item -ItemType Directory -Force -Path "$stage\Desktop","$stage\usbip" | Out-Null
          Copy-Item (Join-Path $out "Steam Controller Remapper.exe") "$stage\Desktop"
          Copy-Item (Join-Path $out "libVIIPER.dll")                "$stage\Desktop"

          # The driver is what makes this a first-time install rather than an
          # update, so fetch the current signed usbip-win2 release.
          $rel = Invoke-RestMethod -Headers @{ 'User-Agent' = 'NonSteamControllerBuild' } `
                   -Uri 'https://api.github.com/repos/vadimgrn/usbip-win2/releases/latest'
          $asset = $rel.assets | Where-Object { $_.name -like '*x64*.exe' } | Select-Object -First 1
          if (-not $asset) { throw "No x64 .exe asset in the latest usbip-win2 release." }
          Write-Host "usbip-win2: $($rel.tag_name) / $($asset.name)"
          Invoke-WebRequest -Headers @{ 'User-Agent' = 'NonSteamControllerBuild' } `
            -Uri $asset.browser_download_url -OutFile "$stage\usbip\USBip-win2-x64.exe"

          choco install innosetup -y --no-progress
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }

          # Inno rejects a leading 'v' in AppVersion.
          $ver = ($env:GITHUB_REF_NAME -replace '^v','')
          & $iscc "/DMyAppVersion=$ver" "installer\NonSteamController-Standalone.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }

          $setup = Get-ChildItem "installer\output\*Setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "Installer not produced." }
          "SETUP=$($setup.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Built $($setup.Name) ($([math]::Round($setup.Length/1MB,2)) MB)"

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Built as an array and written to a file rather than a here-string:
          # a PowerShell here-string terminator must sit at column 0, which
          # cannot coexist with a YAML block scalar's indentation.
          $tag = $env:GITHUB_REF_NAME
          $notes = @(
            "### Install"
            ''
            'Download the **Setup.exe** and run it. It is self-contained: it installs'
            'the app and, on a fresh machine, the signed usbip-win2 driver the virtual'
            'controller needs. Administrator rights are required for the driver.'
            ''
            'The **portable zip** is an update path only — app plus `libVIIPER.dll`,'
            'no driver. Use it if you already have a working install.'
            ''
            '### Notes'
            ''
            'The installer does not include the Xbox Game Bar widget. That part is an'
            'MSIX and a sideloadable MSIX must be signed, which CI cannot do without a'
            'certificate — see `.github/workflows/release.yml`. Everything in the tray'
            'app itself is unaffected. It installs under its own AppId, so it will not'
            'replace a widget-enabled install.'
            ''
            'SmartScreen will warn on first run: these builds are unsigned.'
            ''
            'Requires Windows 10+ (64-bit) and a 2026 Steam Controller.'
          ) -join "`n"
          $notesFile = Join-Path $PWD 'release-notes.md'
          $notes | Out-File -FilePath $notesFile -Encoding utf8

          # Any semver prerelease tag (v0.1.0-alpha, v1.8.0-rc1) is published as a
          # prerelease; a plain vX.Y.Z becomes a full release. GitHub's
          # /releases/latest endpoint excludes prereleases, so the in-app updater
          # will not offer one to users.
          # Setup.exe listed first so it is the obvious download.
          $gh = @('release','create',"$tag","$env:SETUP","$env:ZIP",
                  '--title',"$tag",'--notes-file',"$notesFile")
          if ($tag -match '-') {
              $gh += '--prerelease'
              Write-Host "Publishing $tag as a prerelease."
          }
          & gh @gh

# ---------------------------------------------------------------------------
# Enabling the full signed installer
# ---------------------------------------------------------------------------
# The widget MSIX must be signed by a certificate whose subject exactly matches
# the Publisher in gamebar/SteamControllerRemapperWidget/Package.appxmanifest.
# Generate one once and reuse it, so the widget keeps a stable package identity
# across releases (a new certificate each build changes identity and forces
# users to uninstall the old widget):
#
#   $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=lyndon025" `
#       -KeyUsage DigitalSignature -FriendlyName NonSteamController `
#       -CertStoreLocation "Cert:\CurrentUser\My" `
#       -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
#   $pw = ConvertTo-SecureString -String "<a password>" -Force -AsPlainText
#   Export-PfxCertificate -Cert $cert -FilePath cert.pfx -Password $pw
#   [Convert]::ToBase64String([IO.File]::ReadAllBytes("cert.pfx")) | Set-Clipboard
#
# Store the base64 as secret SIGNING_PFX_BASE64 and the password as
# SIGNING_PFX_PASSWORD, then add a step before the build that writes the pfx to
# disk, imports it with Import-PfxCertificate, and passes its thumbprint to
# installer/Build-Installer.ps1 -CertificateThumbprint.
#
# Note a self-signed certificate is not trusted by default; the installer
# imports the exported .cer into the trust store (installer/widget-install.ps1),
# which is what makes sideloading work.
